[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycul"
version = "0.1.1"
description = "Asyncio library for busware CUL / culfw sticks (eQ-3 MAX! and more)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Nils Sowen", email = "n.sowen@2scale.net" }]
requires-python = ">=3.12"
dependencies = ["pyserial-asyncio-fast>=0.11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
keywords = ["cul", "culfw", "max", "moritz", "eq3", "home-assistant"]

[project.urls]
Homepage = "https://github.com/nsowen/pycul"
Issues = "https://github.com/nsowen/pycul/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
pycul = "pycul.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pycul"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
